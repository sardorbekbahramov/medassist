services:
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medassist_bot
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - medassist_net

  db:
    image: postgres:15-alpine
    container_name: medassist_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medassist
      POSTGRES_USER: medassist
      POSTGRES_PASSWORD: medassist_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medassist"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medassist_net

  redis:
    image: redis:7-alpine
    container_name: medassist_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medassist_net

volumes:
  pgdata:

networks:
  medassist_net:
    driver: bridge